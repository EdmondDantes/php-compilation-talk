<!doctype html>
<html lang="ru" data-theme="terminal">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PHP и компиляция — плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&family=Fira+Sans+Condensed:wght@400;600;700&family=Fira+Sans:wght@400;500&family=Fira+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/player.css" />
<link rel="stylesheet" href="css/slides.css" />
</head>
<!-- data-limit: the talk's slot in minutes, past which the timer turns amber. -->
<body data-limit="45">

<div class="viewport">
  <!-- data-parts: the deck, in order. Add a part by adding its file here. -->
  <div class="stage" data-parts="deck/00-intro.html, deck/02-map.html, deck/03-two-paths.html, deck/04-next.html, deck/90-inventory.html">
  </div>
</div>

<!-- Theme menu: the deck's look, chosen by name rather than cycled blind. -->
<div class="themes">
  <button type="button" class="pick" aria-haspopup="true" aria-expanded="false">
    <span class="name"></span><i aria-hidden="true"></i>
  </button>
  <ul class="menu">
    <li><button type="button" data-theme="terminal">Терминал</button></li>
    <li><button type="button" data-theme="blueprint">Чертёж</button></li>
    <li><button type="button" data-theme="php">Слон</button></li>
  </ul>
</div>

<!-- Back and forward for a hand on a trackpad; the keyboard does the same. -->
<div class="control">
  <button type="button" class="back" aria-label="Предыдущий слайд">&#8249;</button>
  <span class="at"></span>
  <button type="button" class="forward" aria-label="Следующий слайд">&#8250;</button>
  <button type="button" class="prompter" aria-label="Что говорить">//</button>
</div>

<!-- Speaker's own text over the slide, for a talk given from one screen. -->
<aside class="script"><p></p></aside>

<div class="progress" aria-hidden="true"><i></i></div>

<!-- Thumbnail grid; filled from slide clones the first time it opens. -->
<div class="overview" aria-label="Обзор слайдов"></div>

<!-- Presenter screen. Shown only in the window opened with #presenter. -->
<div class="presenter">
  <div class="bar">
    <span class="timer">0:00</span>
    <span class="position"></span>
    <span class="clock"></span>
  </div>
  <div class="now">
    <div class="shot"></div>
  </div>
  <div class="side">
    <div class="next">
      <span class="label">Дальше</span>
      <div class="shot"></div>
    </div>
    <div class="notes"></div>
  </div>
</div>

<div class="help">
  <dl>
    <dt>→ ␣ ↓</dt><dd>вперёд</dd>
    <dt>← ↑</dt><dd>назад</dd>
    <dt>цифры, Enter</dt><dd>перейти к слайду</dd>
    <dt>N</dt><dd>что говорить: заметки поверх слайда</dd>
    <dt>O</dt><dd>обзор слайдов</dd>
    <dt>T</dt><dd>тема: Терминал / Чертёж / Слон</dd>
    <dt>P</dt><dd>докладчицкий экран</dd>
    <dt>F</dt><dd>во весь экран</dd>
    <dt>B</dt><dd>затемнить</dd>
    <dt>R</dt><dd>сбросить таймер</dd>
    <dt>Esc</dt><dd>закрыть слой</dd>
  </dl>
</div>

<script src="js/player.js"></script>
</body>
</html>
